openapi: "3.0.3"
info:
  title: Internship Manager API
  description: |
    API for managing internships with role-based access control for students, supervisors (guarantors), and companies.
    Uses tokens for authentication.

    **Authentication flow:**
    1. The user sends a POST request to `/auth/login` with email and password.
    2. The server returns a JWT token in the response.
    3. For all protected endpoints, the client must include the token in the `Authorization: Bearer <token>` header.
    4. Example:
       - Login: `POST /auth/login` with JSON body `{ "email": "user@example.com", "password": "password" }`
       - Use token: `Authorization: Bearer <token>` in all subsequent requests.
  version: 1.0.0
servers:
  - url: 'http://127.0.0.1:8000'
paths:
  /api/auth/login:
    post:
      summary: User login
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              examples:
                supervisor:
                  summary: Supervisor login success
                  value:
                    success: true
                    statusCode: 200
                    message: Používateľ bol úspešne prihlásený.
                    data:
                      id: 2
                      name: Ing.Ján Novák
                      email: jan.novak@ukf.sk
                      roles:
                        - id: 2
                          name: supervisor
                      student: null
                      supervisor:
                        id: 1
                        title: Ing.
                        first_name: Ján
                        last_name: Novák
                        email: jan.novak@ukf.sk
                      company: null
                    token: <jwt_token>
                student:
                  summary: Student login success
                  value:
                    success: true
                    statusCode: 200
                    message: Používateľ bol úspešne prihlásený.
                    data:
                      id: 1
                      name: John Doe
                      email: john.student@example.com
                      roles:
                        - id: 1
                          name: student
                      student:
                        id: 1
                        first_name: John
                        last_name: Doe
                        student_email: john.student@example.com
                        primary_email: john.alt@example.com
                        phone: '123456789'
                        address: 123 Main St, Cityville
                      supervisor: null
                      company: null
                    token: <jwt_token>
                company:
                  summary: Company login success
                  value:
                    success: true
                    statusCode: 200
                    message: Používateľ bol úspešne prihlásený.
                    data:
                      id: 5
                      name: Slovenské IT s.r.o.
                      email: michal.kral@slovenskeit.sk
                      roles:
                        - id: 3
                          name: company
                      student: null
                      supervisor: null
                      company:
                        id: 1
                        name: Slovenské IT s.r.o.
                        address: Mlynské nivy 16, 821 09 Bratislava
                        contact_name: Michal Kráľ
                        contact_email: michal.kral@slovenskeit.sk
                        contact_phone: '+421-2-5555-1234'
                    token: <jwt_token>
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                summary: Login failed
                value:
                  success: false
                  statusCode: 401
                  message: Neplatné prihlasovacie údaje.
        '422':
          description: Unprocessable Content
          content:
            application/json:
              example:
                message: 'The given data was invalid.'
                errors:
                  email:
                    - The email field is required.
                  password:
                    - The password field is required.
                  type:
                    - Pole typ je povinné.
  /api/auth/logout:
    post:
      summary: User logout
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        '200':
          description: Successful logout
          content:
            application/json:
              example:
                success: true
                statusCode: 200
                message: Používateľ bol úspešne odhlásený.
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: 'Unauthenticated.'
  /api/auth/register:
    post:
      summary: User registration
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Student registration
                  type: object
                  required: [type, student_email, first_name, password]
                  properties:
                    type:
                      type: integer
                      enum: [1]
                      description: Role type (1 = student)
                    first_name:
                      type: string
                    last_name:
                      type: string
                    student_email:
                      type: string
                      format: email
                    primary_email:
                      type: string
                      format: email
                    phone:
                      type: string
                    address:
                      type: string
                    study_program:
                      type: integer
                      description: |
                        IDs of study programs as defined in the study_programs table (e.g., 1 = INF-B, Bachelor in
                        Informatics).
                - title: Company registration
                  type: object
                  required: [type, contact_email, name, password]
                  properties:
                    type:
                      type: integer
                      enum: [3]
                      description: Role type (3 = company)
                    name:
                      type: string
                    address:
                      type: string
                    contact_name:
                      type: string
                    contact_email:
                      type: string
                      format: email
                    contact_phone:
                      type: string
                    password:
                      type: string
                      format: password
            examples:
              student:
                summary: Student registration
                value:
                  type: 1
                  first_name: John
                  last_name: Doe
                  student_email: user@student.ukf.sk
                  primary_email: user@student.ukf.sk
                  phone: '123456789'
                  address: 123 Main St, Cityville
                  study_program: 1
              company:
                summary: Company registration
                value:
                  type: 3
                  name: Slovenské IT
                  address: Mlynské nivy 16, 821 09 Bratislava
                  contact_name: Michal Kráľ
                  contact_email: company@example.com
                  contact_phone: '+421-2-5555-1234'
                  password: password123
      responses:
        '201':
          description: User registered
          content:
            application/json:
              example:
                success: true
                statusCode: 201
                message: Používateľ bol úspešne zaregistrovaný. Skontrolujte svoj e-mail, aby ste overili svoj účet.
        '422':
          description: Unprocessable Content
          content:
            application/json:
              examples:
                missing_field:
                  summary: Missing required field
                  value:
                    message: 'Vybraná hodnota pre {property} je neplatná.'
                    errors:
                      type:
                        - Pole typ je povinné.
                      first_name:
                        - Pole krstné meno je povinné.
                      last_name:
                        - Pole priezvisko je povinné.
                      student_email:
                        - Pole študentský email je povinné.
                      primary_email:
                        - Pole primárny email je povinné.
                      phone:
                        - Pole telefónne číslo je povinné.
                      address:
                        - Pole adresa je povinné.
                      study_program:
                        - Pole študijný program je povinné.
                      name:
                        - Pole názov spoločnosti je povinné.
                      contact_name:
                        - Pole kontaktné meno je povinné.
                      contact_email:
                        - Pole kontaktný email je povinné.
                      contact_phone:
                        - Pole kontaktné telefónne číslo je povinné.
                      password:
                        - The password field is required.
                email_taken:
                  summary: Email already taken
                  value:
                    message: 'Táto hodnota pre e-mail kontaktnej osoby už bola použitá'
                    errors:
                      contact_email:
                        - Táto hodnota pre e-mail kontaktnej osoby už bola použitá.
  /api/company/activate/{token}:
    get:
      summary: Activate company account
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        '200':
          description: Company account activated
          content:
            application/json:
              example:
                success: true
                statusCode: 200
                message: Účet spoločnosti bol úspešne aktivovaný. Môžete sa prihlásiť.
        '404':
          description: Token not found or expired
          content:
            application/json:
              example:
                success: false
                statusCode: 404
                message: Neplatný alebo expirovaný aktivačný token.
  /api/auth/forgot-password:
    post:
      summary: Request password recovery email with link to reset password
      description: |
        After submitting the request, a password reset link will be sent to the specified email address.
        The link has the following format and leads to the password reset form on the frontend:
        Example: http://localhost:3000/reset-password?token={token}&email={email}
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Recovery email sent
          content:
            application/json:
              example:
                success: true
                statusCode: 200
                message: Odkaz na obnovenie hesla bol odoslaný na váš e-mail.
        '404':
          description: Email not found
          content:
            application/json:
              example:
                success: false
                statusCode: 404
                message: Tento e-mail nie je zaregistrovaný.
  /api/auth/update-password:
    post:
      summary: Change password
      description: |
        This endpoint is called from the password reset form, which is opened via the link sent to the user's email
        address (see the link format in the /api/auth/forgot-password endpoint description).
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                email:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              example:
                success: true
                statusCode: 200
                message: Heslo bolo úspešne aktualizované.
        '422':
          description: Unprocessable Content
          content:
            application/json:
              example:
                success: false
                statusCode: 422
                message: 'Nepodarilo sa aktualizovať heslo. Token je neplatný alebo expirovaný.'
  /api/auth/user:
    get:
      summary: Get current user info
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        '200':
          description: User info
          content:
            application/json:
              examples:
                supervisor:
                  summary: Supervisor info
                  value:
                    success: true
                    statusCode: 200
                    message: Prihlásený.
                    data:
                      id: 2
                      name: Ing.Ján Novák
                      email: jan.novak@ukf.sk
                      roles:
                        - id: 2
                          name: supervisor
                      student: null
                      supervisor:
                        id: 1
                        title: Ing.
                        first_name: Ján
                        last_name: Novák
                        email: jan.novak@ukf.sk
                      company: null
                student:
                  summary: Student info
                  value:
                    success: true
                    statusCode: 200
                    message: Prihlásený.
                    data:
                      id: 1
                      name: John Doe
                      email: john.student@example.com
                      roles:
                        - id: 1
                          name: student
                      student:
                        id: 1
                        first_name: John
                        last_name: Doe
                        student_email: john.student@example.com
                        primary_email: john.alt@example.com
                        phone: '123456789'
                        address: 123 Main St, Cityville
                      supervisor: null
                      company: null
                company:
                  summary: Company info
                  value:
                    success: true
                    statusCode: 200
                    message: Prihlásený.
                    data:
                      id: 5
                      name: Slovenské IT s.r.o.
                      email: michal.kral@slovenskeit.sk
                      roles:
                        - id: 3
                          name: company
                    student: null
                    supervisor: null
                    company:
                      id: 1
                      name: Slovenské IT s.r.o.
                      address: Mlynské nivy 16, 821 09 Bratislava
                      contact_name: Michal Kráľ
                      company_email: null
                      contact_email: michal.kral@slovenskeit.sk
                      contact_phone: '+421-2-5555-1234'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: 'Unauthenticated.'
  /api/companies:
    post:
      summary: Get list of companies (supervisor only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: object
                  properties:
                    status:
                      type: boolean
                    name:
                      type: string
                    address:
                      type: string
                    contact_name:
                      type: string
                    contact_email:
                      type: string
                    contact_phone:
                      type: string
                sortBy:
                  type: string
                  description: Field to sort by
                sortOrder:
                  type: string
                  enum: [asc, desc]
                  description: Sort order
                itemsPerPage:
                  type: integer
                  description: Items per page
                page:
                  type: integer
                  description: Page number
            example:
              search:
                status: true
                name: Slovenské IT
              sortBy: name
              sortOrder: asc
              itemsPerPage: 10
              page: 1
      responses:
        '200':
          description: List of companies
          content:
            application/json:
              example:
                data:
                  current_page: 1
                  data:
                    - id: 1
                      user_id: 5
                      name: Slovenské IT s.r.o.
                      address: Mlynské nivy 16, 821 09 Bratislava
                      contact_name: Michal Kráľ
                      contact_email: michal.kral@slovenskeit.sk
                      contact_phone: '+421-2-5555-1234'
                      status: 1
                      created_at: '2025-10-09T20:22:24.000000Z'
                      updated_at: '2025-10-11T13:16:38.000000Z'
                    - id: 2
                      user_id: 6
                      name: Energo Slovensko a.s.
                      address: Štefánikova 24, 811 05 Bratislava
                      contact_name: Veronika Holubová
                      contact_email: veronika.holubova@energosk.sk
                      contact_phone: '+421-2-4444-5678'
                      status: 1
                      created_at: '2025-10-09T20:22:24.000000Z'
                      updated_at: '2025-10-09T20:22:24.000000Z'
                    - id: 3
                      user_id: 7
                      name: Zdravie Plus s.r.o.
                      address: Kukučínova 7, 040 01 Košice
                      contact_name: Lucia Benešová
                      contact_email: lucia.benesova@zdravieplus.sk
                      contact_phone: '+421-55-123-4567'
                      status: 0
                      created_at: '2025-10-09T20:22:24.000000Z'
                      updated_at: '2025-10-09T20:22:24.000000Z'
                  first_page_url: 'http://127.0.0.1:8000/api/companies?page=1'
                  from: 1
                  last_page: 1
                  last_page_url: 'http://127.0.0.1:8000/api/companies?page=1'
                  links:
                    - url: null
                      label: 'pagination.previous'
                      page: null
                      active: false
                    - url: 'http://127.0.0.1:8000/api/companies?page=1'
                      label: '1'
                      page: 1
                      active: true
                    - url: null
                      label: 'pagination.next'
                      page: null
                      active: false
                  next_page_url: null
                  path: 'http://127.0.0.1:8000/api/companies'
                  per_page: 10
                  prev_page_url: null
                  to: 3
                  total: 3
        '422':
          description: Unprocessable Content
          content:
            application/json:
              example:
                message: 'Vybraná hodnota pre sort by je neplatná.'
                errors:
                  sortBy:
                    - Vybraná hodnota pre sort by je neplatná.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                message: 'Forbidden. Role required: supervisor'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: 'Unauthenticated.'
  /api/companies/{id}:
    get:
      summary: Get company info by ID (supervisor only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        '200':
          description: Company info
          content:
            application/json:
              example:
                id: 1
                user_id: 5
                name: Slovenské IT s.r.o.
                address: Mlynské nivy 16, 821 09 Bratislava
                contact_name: Michal Kráľ
                contact_email: michal.kral@slovenskeit.sk
                contact_phone: '+421-2-5555-1234'
                status: 1
                created_at: '2025-10-09T20:22:24.000000Z'
                updated_at: '2025-10-09T20:22:24.000000Z'
        '404':
          description: Company not found
          content:
            application/json:
              example:
                status: false
                message: 'Spoločnosť nebola nájdená.'
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                message: 'Forbidden. Role required: supervisor'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: 'Unauthenticated.'
  /api/companies/{id}/company_change_status:
    post:
      summary: Change company status (supervisor only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: boolean
      responses:
        '200':
          description: Company status changed
          content:
            application/json:
              example:
                message: Stav spoločnosti bol úspešne aktualizovaný.
        '404':
          description: Company not found
          content:
            application/json:
              example:
                status: false
                message: 'Spoločnosť nebola nájdená.'
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                message: 'Forbidden. Role required: supervisor'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: 'Unauthenticated.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AcceptHeader:
      in: header
      name: Accept
      required: true
      schema:
        type: string
        enum: [application/json]
      description: Must be 'application/json'
