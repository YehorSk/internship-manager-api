openapi: "3.0.3"
info:
  title: Internship Manager API
  description: |
    API for managing internships with role-based access control for students, supervisors (guarantors), and companies. Uses tokens for authentication.

    **Authentication flow:**
    1. The user sends a POST request to `/auth/login` with email and password.
    2. The server returns a JWT token in the response.
    3. For all protected endpoints, the client must include the token in the `Authorization: Bearer <token>` header.
    4. Example:
       - Login: `POST /auth/login` with JSON body `{ "email": "user@example.com", "password": "password" }`
       - Use token: `Authorization: Bearer <token>` in all subsequent requests.
  version: 1.0.0
servers:
  - url: 'http://127.0.0.1:80'
paths:
  /api/auth/login:
    post:
      summary: User login
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              examples:
                supervisor:
                  summary: Supervisor login success
                  value:
                    success: true
                    statusCode: 200
                    message: Používateľ bol úspešne prihlásený.
                    data:
                      id: 2
                      name: Ing.Ján Novák
                      email: jan.novak@ukf.sk
                      roles:
                        - id: 2
                          name: supervisor
                      student: null
                      supervisor:
                        id: 1
                        title: Ing.
                        first_name: Ján
                        last_name: Novák
                        email: jan.novak@ukf.sk
                      company: null
                    token: <jwt_token>
                student:
                  summary: Student login success
                  value:
                    success: true
                    statusCode: 200
                    message: Používateľ bol úspešne prihlásený.
                    data:
                      id: 1
                      name: John Doe
                      email: john.student@example.com
                      roles:
                        - id: 1
                          name: student
                      student:
                        id: 1
                        first_name: John
                        last_name: Doe
                        student_email: john.student@example.com
                        primary_email: john.alt@example.com
                        phone: '123456789'
                        address: 123 Main St, Cityville
                      supervisor: null
                      company: null
                    token: <jwt_token>
                company:
                  summary: Company login success
                  value:
                    success: true
                    statusCode: 200
                    message: Používateľ bol úspešne prihlásený.
                    data:
                      id: 5
                      name: Slovenské IT s.r.o.
                      email: michal.kral@slovenskeit.sk
                      roles:
                        - id: 3
                          name: company
                      student: null
                      supervisor: null
                      company:
                        id: 1
                        name: Slovenské IT s.r.o.
                        address: Mlynské nivy 16, 821 09 Bratislava
                        contact_name: Michal Kráľ
                        contact_email: michal.kral@slovenskeit.sk
                        contact_phone: '+421-2-5555-1234'
                    token: <jwt_token>
        '401':
            description: Unauthorized
            content:
              application/json:
                example:
                  summary: Login failed
                  value:
                    success: false
                    statusCode: 401
                    message: Neplatné prihlasovacie údaje.
  /api/auth/register:
    post:
      summary: User registration
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User registered
  /api/auth/update-password:
    post:
      summary: Change password
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password changed
  /api/auth/forgot-password:
    post:
      summary: Password recovery
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Recovery email sent
  /api/auth/user:
    get:
      summary: Get current user info
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        '200':
          description: User info
  /api/auth/logout:
    post:
      summary: User logout
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        '200':
          description: Successful logout
  /api/companies:
    post:
      summary: Get list of companies (supervisor only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: object
                  properties:
                    status:
                      type: boolean
                    name:
                      type: string
                    address:
                      type: string
                    contact_name:
                      type: string
                    contact_email:
                      type: string
                    contact_phone:
                      type: string
                sortBy:
                  type: string
                  description: Field to sort by
                sortOrder:
                  type: string
                  enum: [asc, desc]
                  description: Sort order
                itemsPerPage:
                  type: integer
                  description: Items per page
                page:
                  type: integer
                  description: Page number
            example:
              search:
                status: true
                name: Slovenské IT
              sortBy: name
              sortOrder: asc
              itemsPerPage: 10
              page: 1
      responses:
        '200':
          description: List of companies
          content:
            application/json:
              example:
                data:
                  current_page: 1
                  data:
                    - id: 1
                      user_id: 5
                      name: Slovenské IT s.r.o.
                      address: Mlynské nivy 16, 821 09 Bratislava
                      contact_name: Michal Kráľ
                      contact_email: michal.kral@slovenskeit.sk
                      contact_phone: '+421-2-5555-1234'
                      status: 1
                      created_at: '2025-10-09T20:22:24.000000Z'
                      updated_at: '2025-10-11T13:16:38.000000Z'
                    - id: 2
                      user_id: 6
                      name: Energo Slovensko a.s.
                      address: Štefánikova 24, 811 05 Bratislava
                      contact_name: Veronika Holubová
                      contact_email: veronika.holubova@energosk.sk
                      contact_phone: '+421-2-4444-5678'
                      status: 1
                      created_at: '2025-10-09T20:22:24.000000Z'
                      updated_at: '2025-10-09T20:22:24.000000Z'
                    - id: 3
                      user_id: 7
                      name: Zdravie Plus s.r.o.
                      address: Kukučínova 7, 040 01 Košice
                      contact_name: Lucia Benešová
                      contact_email: lucia.benesova@zdravieplus.sk
                      contact_phone: '+421-55-123-4567'
                      status: 0
                      created_at: '2025-10-09T20:22:24.000000Z'
                      updated_at: '2025-10-09T20:22:24.000000Z'
                  first_page_url: 'http://127.0.0.1:80/api/companies?page=1'
                  from: 1
                  last_page: 1
                  last_page_url: 'http://127.0.0.1:80/api/companies?page=1'
                  links:
                    - url: null
                      label: 'pagination.previous'
                      page: null
                      active: false
                    - url: 'http://127.0.0.1:80/api/companies?page=1'
                      label: '1'
                      page: 1
                      active: true
                    - url: null
                      label: 'pagination.next'
                      page: null
                      active: false
                  next_page_url: null
                  path: 'http://127.0.0.1:80/api/companies'
                  per_page: 10
                  prev_page_url: null
                  to: 3
                  total: 3
        '422':
            description: Unprocessable Content
            content:
              application/json:
                example:
                  message: 'Vybraná hodnota pre sort by je neplatná.'
                  errors:
                    sortBy:
                      - Vybraná hodnota pre sort by je neplatná.
        '403':
            description: Forbidden
            content:
              application/json:
                example:
                  message: 'Forbidden. Role required: supervisor'
        '401':
            description: Unauthorized
            content:
              application/json:
                example:
                  message: 'Unauthenticated.'
  /api/companies/{id}:
    get:
      summary: Get company info by ID (supervisor only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        '200':
          description: Company info
          content:
            application/json:
              example:
                id: 1
                user_id: 5
                name: Slovenské IT s.r.o.
                address: Mlynské nivy 16, 821 09 Bratislava
                contact_name: Michal Kráľ
                contact_email: michal.kral@slovenskeit.sk
                contact_phone: '+421-2-5555-1234'
                status: 1
                created_at: '2025-10-09T20:22:24.000000Z'
                updated_at: '2025-10-09T20:22:24.000000Z'
        '404':
          description: Company not found
          content:
            application/json:
              example:
                status: false
                message: 'Spoločnosť nebola nájdená.'
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                message: 'Forbidden. Role required: supervisor'
        '401':
            description: Unauthorized
            content:
              application/json:
                example:
                  message: 'Unauthenticated.'
  /api/companies/{id}/company_change_status:
    post:
      summary: Change company status (supervisor only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: boolean
      responses:
        '200':
          description: Company status changed
          content:
            application/json:
              example:
                message: Stav spoločnosti bol úspešne aktualizovaný.
        '404':
          description: Company not found
          content:
            application/json:
              example:
                status: false
                message: 'Spoločnosť nebola nájdená.'
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                message: 'Forbidden. Role required: supervisor'
        '401':
            description: Unauthorized
            content:
                application/json:
                    example:
                        message: 'Unauthenticated.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AcceptHeader:
      in: header
      name: Accept
      required: true
      schema:
        type: string
        enum: [application/json]
      description: Must be 'application/json'
