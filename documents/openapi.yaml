  /api/practices/{id}/download-report:
    get:
      tags:
        - Practices
      summary: Download editable practice report (DOCX) — auto-filled, editable template for the student owner
      description: |
        Generates an editable DOCX file from a template with practice metadata pre-filled (student, company, dates, standard duration and other fixed fields).
        Intended for the student who owns the practice to complete narrative sections (e.g. list of performed tasks) in MS Word before printing or handing to the employer for review and signature.
        Only the student who owns the specified practice may download this template. This endpoint does not produce the final signed PDF that a student may scan and upload to the practice record.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        '200':
          description: DOCX file
          content:
