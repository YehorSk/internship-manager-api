                      contact_name: Michal Kráľ
                      company_email: null
                      contact_email: michal.kral@slovenskeit.sk
                      contact_phone: '+421-2-5555-1234'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: 'Unauthenticated.'
