  /api/practices/list:
    post:
      tags:
        - Practices
      summary: Get list of practices
      description: |
        Returns a paginated list of practices visible to the current authenticated user. Visibility depends on the
        current user's role:
          - student: sees only their own practices (where student_id = current user id)
          - company: sees practices related to their company (where company_id = current company id)
          - supervisor: sees practices for the programs they supervise
        The endpoint requires a Bearer token.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: object
                  properties:
                    status:
                      type: string
                      description: one of enum values from PracticeStatusEnum
                    semester:
                      type: string
                    academic_year:
                      type: string
                    start_date:
