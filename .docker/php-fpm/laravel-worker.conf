[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=gosu %(ENV_UID)s:%(ENV_GID)s php %(ENV_APP_PATH)s/artisan queue:work --queue=reports,check-company-email,default --sleep=3 --tries=3
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=8
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-worker.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=3600
priority=10
